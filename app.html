<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windowsill math - calculators</title>
<style>
  :root { --accent: #5b8c5a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #f8faf7; color: #28302a; line-height: 1.55; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 2rem; margin: 0 0 8px; color: var(--accent); }
  .lede { margin: 0 0 28px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  section { background: #fff; border: 1px solid #dde7dc; border-radius: 8px; padding: 20px 22px; }
  h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .hint { font-size: 0.9rem; color: #6a7a6a; margin: 0 0 14px; }
  label { display: block; font-size: 0.9rem; margin: 10px 0 3px; }
  input { width: 100%; padding: 8px 10px; font-size: 1rem; border: 1px solid #c3d4c2; border-radius: 5px; font-family: inherit; }
  button { margin-top: 16px; width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.08); }
  .out { margin-top: 14px; font-size: 1rem; min-height: 1.4em; }
  .out.err { color: #a32222; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; font-size: 0.85rem; color: #92a091; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Windowsill math</h1>
  <p class="lede">The pots that fit, the weight they add and the water they drink. Exact arithmetic, every borrowed number labeled.</p>
  <div class="grid">
    <section>
      <h2>Pot plan</h2>
      <p class="hint">A sill becomes pots.</p>
      <label for="p-sill">Sill length (cm)</label>
      <input id="p-sill" type="number" value="120" min="0" step="5">
      <label for="p-depth">Sill depth (cm)</label>
      <input id="p-depth" type="number" value="20" min="0" step="1">
      <label for="p-pot">Pot diameter (cm)</label>
      <input id="p-pot" type="number" value="14" min="0" step="1">
      <button id="p-go">Count the pots</button>
      <div class="out" id="p-out"></div>
    </section>
    <section>
      <h2>Weight plan</h2>
      <p class="hint">Pots become kilograms.</p>
      <label for="w-pots">Pots</label>
      <input id="w-pots" type="number" value="8" min="0" step="1">
      <label for="w-liters">Soil per pot (L)</label>
      <input id="w-liters" type="number" value="3" min="0" step="0.5">
      <label for="w-density">Wet soil (kg per L)</label>
      <input id="w-density" type="number" value="1.3" min="0" step="0.1">
      <button id="w-go">Weigh the sill</button>
      <div class="out" id="w-out"></div>
    </section>
    <section>
      <h2>Water plan</h2>
      <p class="hint">Pots become liters a week.</p>
      <label for="a-pots">Pots</label>
      <input id="a-pots" type="number" value="8" min="0" step="1">
      <label for="a-ml">Water per pot (ml)</label>
      <input id="a-ml" type="number" value="250" min="0" step="50">
      <label for="a-days">Days between waterings</label>
      <input id="a-days" type="number" value="3" min="0" step="1">
      <button id="a-go">Count the liters</button>
      <div class="out" id="a-out"></div>
    </section>
  </div>
</main>
<footer>Built by the app factory. <a href="index.html">About</a> &middot; <a href="https://github.com/iLanis-agent/windowsillmath">Source</a></footer>
<script src="engine.js"></script>
<script>
function num(id){ return parseFloat(document.getElementById(id).value); }
function show(id, r, render){
  var el = document.getElementById(id);
  if (r.error) { el.textContent = r.error; el.classList.add('err'); }
  else { el.textContent = render(r); el.classList.remove('err'); }
}
document.getElementById('p-go').addEventListener('click', function(){
  show('p-out', WindowsillMath.potPlan(num('p-sill'),num('p-depth'),num('p-pot')), function(r){ return WindowsillMath.renderPot(r, num('p-sill'), num('p-depth'), num('p-pot')); });
});
document.getElementById('w-go').addEventListener('click', function(){
  show('w-out', WindowsillMath.weightPlan(num('w-pots'),num('w-liters'),num('w-density')), function(r){ return WindowsillMath.renderWeight(r, num('w-pots'), num('w-liters'), num('w-density')); });
});
document.getElementById('a-go').addEventListener('click', function(){
  show('a-out', WindowsillMath.waterPlan(num('a-pots'),num('a-ml'),num('a-days')), function(r){ return WindowsillMath.renderWater(r, num('a-pots'), num('a-ml'), num('a-days')); });
});
</script>
</body>
</html>
